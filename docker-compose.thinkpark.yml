name: thinkpark-contract-review

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    env_file:
      - ${CONTRACT_REVIEW_ENV_FILE:-./deploy/thinkpark.env}
    volumes:
      - contract_review_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - contract_review

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        DEBIAN_MIRROR_HOST: ${DEBIAN_MIRROR_HOST:-http://deb.debian.org}
    restart: unless-stopped
    env_file:
      - ${CONTRACT_REVIEW_ENV_FILE:-./deploy/thinkpark.env}
    environment:
      PORT: "3000"
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      VECTOR_STORE: postgres
      REVIEW_KB_ONLY_MODE: "true"
      REVIEW_TEMPLATE_PROFILE: zhongan
      THINKPARK_SSO_ENABLED: "true"
      THINKPARK_STORAGE_REQUIRED: "true"
      AUTH_COOKIE_PATH: /contract-review
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - contract_review_uploads:/app/uploads
      - contract_review_files:/app/public/files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - contract_review

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        BASE_URL: /contract-review/
        VITE_APP_BACKEND_API_URL: ""
        VITE_APP_ONLYOFFICE_URL: /onlyoffice/
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-18087}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - contract_review

networks:
  contract_review:
    driver: bridge

volumes:
  contract_review_postgres:
  contract_review_uploads:
  contract_review_files:

# THINK Open production reverse proxy for the independent contract-review app.
#
# The trailing slash on proxy_pass is intentional: it replaces the public
# /contract-review/ prefix before the request reaches the app's own Nginx.
# Without it, Vite assets are looked up as /contract-review/assets/* inside
# the container and the SPA fallback returns index.html for JavaScript/CSS.
location = /contract-review {
    return 308 /contract-review/;
}

location ^~ /contract-review/ {
    proxy_pass http://127.0.0.1:18087/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host/contract-review;
    proxy_set_header X-Forwarded-Prefix /contract-review;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 55m;
}
